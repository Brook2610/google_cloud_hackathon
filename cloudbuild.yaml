steps:
  # 1. Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/website-builder", "."]

  # 2. Push the image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/website-builder"]

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "website-builder"
      - "--image"
      - "gcr.io/$PROJECT_ID/website-builder"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      # MOUNT GCS BUCKET FOR SITES PERSISTENCE
      - "--add-volume"
      - "name=sites_storage,type=cloud-storage,bucket=gcp-hackathon-2"
      - "--add-volume-mount"
      - "volume=sites_storage,mount-path=/app/sites"
      # MOUNT PERSISTENT VOLUME FOR DATABASE
      - "--add-volume"
      - "name=db_storage,type=cloud-storage,bucket=gcp-hackathon-2"
      - "--add-volume-mount"
      - "volume=db_storage,mount-path=/app/data"
      # ENVIRONMENT VARIABLES
      - "--set-env-vars"
      - "GOOGLE_API_KEY=${_GOOGLE_API_KEY}"
      - "--set-env-vars"
      - "GOOGLE_CLOUD_CREDENTIALS=${_GOOGLE_MAPS_KEY}"
      - "--set-env-vars"
      - "DB_DIR=/app/data"

images:
  - "gcr.io/$PROJECT_ID/website-builder"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _GOOGLE_API_KEY: "PLACEHOLDER_KEY"
  _GOOGLE_CLOUD_CREDENTIALS: "PLACEHOLDER_MAPS_KEY"
