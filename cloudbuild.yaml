steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/website-builder', '.']

  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/website-builder']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'website-builder'
      - '--image'
      - 'gcr.io/$PROJECT_ID/website-builder'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # MOUNT GCS BUCKET FOR PERSISTENCE (Replace [YOUR_BUCKET_NAME])
      - '--add-volume'
      - 'name=sites_storage,type=cloud-storage,bucket=[m]'
      - '--add-volume-mount'
      - 'volume=sites_storage,mount-path=/app/sites'
      # ENVIRONMENT VARIABLES
      - '--set-env-vars'
      - 'GOOGLE_API_KEY=${_GOOGLE_API_KEY}'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_CREDENTIALS=${_GOOGLE_MAPS_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/website-builder'

substitutions:
  _GOOGLE_API_KEY: 'PLACEHOLDER_KEY' 
  _GOOGLE_MAPS_KEY: 'PLACEHOLDER_MAPS_KEY'
